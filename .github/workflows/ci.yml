name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src + tests)
        run: npm run lint

      - name: Build
        run: npm run build

      # The unit suite is hermetic — no browser launches, no network —
      # so `npx playwright install` is intentionally not needed here.
      - name: Test
        run: npm test
